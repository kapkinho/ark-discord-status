name: ARK Discord Status

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: ark-discord-status
  cancel-in-progress: false

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update Discord status
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node ark-status.js

      - name: Save Discord message ID
        run: |
          if [ -n "$(git status --porcelain -- .ark-status-message-id)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .ark-status-message-id
            git commit -m "Save Discord status message ID"
            git push
          else
            echo "Message ID unchanged."
          fi
